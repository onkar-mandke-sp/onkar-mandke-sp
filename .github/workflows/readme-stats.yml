name: Update README cards

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"
      - "github-metrics.svg"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=onkar-mandke-sp&show_icons=true&theme=nord&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          fail_on_error: true

      - name: Commit stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git diff --staged --quiet || git commit -m "Update README stats card"
          git push
