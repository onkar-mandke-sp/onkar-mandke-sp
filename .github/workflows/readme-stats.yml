name: Update README cards

# Optional: generates local SVG cards when METRICS_TOKEN is configured.
# Until then, README uses github-readme-stats.shion.dev directly.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ secrets.METRICS_TOKEN != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=onkar-mandke-sp&show_icons=true&theme=nord&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=onkar-mandke-sp&theme=nord&layout=compact&langs_count=8&count_private=true&card_width=495
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "Update README stats cards"
          git push
